<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AKASA × GHL</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #050505;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* =========================================
           INTRO PAGE
        ========================================= */

        .intro-page {
            position: relative;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    rgba(120, 20, 40, .20) 0%,
                    rgba(50, 10, 25, .12) 28%,
                    transparent 65%
                ),
                #050505;
        }


        /* =========================================
           DARK EDGE FADE
        ========================================= */

        .intro-page::after {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, .75),
                    transparent 28%,
                    transparent 72%,
                    rgba(0, 0, 0, .9)
                );

            z-index: 1;
        }


        /* =========================================
           CENTER GLOW
        ========================================= */

        .intro-page::before {
            content: "";

            position: absolute;

            width: 55vw;
            height: 55vw;

            max-width: 700px;
            max-height: 700px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(130, 20, 50, .10),
                    transparent 70%
                );

            pointer-events: none;

            z-index: 1;
        }


        /* =========================================
           SAKURA
        ========================================= */

        .sakura {
            position: absolute;

            width: 9px;
            height: 9px;

            background: #f0a7bb;

            border-radius: 100% 0 100% 0;

            opacity: .65;

            filter: blur(.2px);

            animation: sakuraFall linear infinite;

            z-index: 3;
        }

        .sakura:nth-child(1) {
            left: 5%;
            animation-duration: 9s;
            animation-delay: -2s;
            width: 7px;
            height: 7px;
        }

        .sakura:nth-child(2) {
            left: 17%;
            animation-duration: 12s;
            animation-delay: -7s;
        }

        .sakura:nth-child(3) {
            left: 29%;
            animation-duration: 8s;
            animation-delay: -4s;
            width: 6px;
            height: 6px;
        }

        .sakura:nth-child(4) {
            left: 42%;
            animation-duration: 11s;
            animation-delay: -9s;
        }

        .sakura:nth-child(5) {
            left: 56%;
            animation-duration: 9s;
            animation-delay: -5s;
            width: 7px;
            height: 7px;
        }

        .sakura:nth-child(6) {
            left: 68%;
            animation-duration: 13s;
            animation-delay: -3s;
        }

        .sakura:nth-child(7) {
            left: 79%;
            animation-duration: 10s;
            animation-delay: -8s;
            width: 6px;
            height: 6px;
        }

        .sakura:nth-child(8) {
            left: 91%;
            animation-duration: 12s;
            animation-delay: -6s;
        }

        .sakura:nth-child(9) {
            left: 96%;
            animation-duration: 8s;
            animation-delay: -1s;
            width: 6px;
            height: 6px;
        }

        @keyframes sakuraFall {

            0% {
                top: -10%;

                transform:
                    translateX(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateX(80px)
                    rotate(180deg);
            }

            100% {
                top: 110%;

                transform:
                    translateX(-60px)
                    rotate(360deg);
            }
        }


        /* =========================================
           DECORATIVE VERTICAL LINES
        ========================================= */

        .decor-line {
            position: absolute;

            width: 1px;
            height: 42vh;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(255,255,255,.13),
                    transparent
                );

            z-index: 2;
        }

        .decor-line.left {
            left: 12%;
            top: 29%;
        }

        .decor-line.right {
            right: 12%;
            top: 29%;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .intro-content {
            position: relative;

            z-index: 5;

            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;

            animation:
                introEntrance 1.5s
                cubic-bezier(.2,.8,.2,1)
                forwards;
        }

        @keyframes introEntrance {

            from {
                opacity: 0;

                transform:
                    translateY(30px)
                    scale(.96);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================================
           AKASA × GHL
        ========================================= */

        .title {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 24px;

            font-size: clamp(
                52px,
                9vw,
                110px
            );

            font-weight: 900;

            letter-spacing: -4px;

            line-height: 1;

            white-space: nowrap;
        }

        .title .akasa {
            color: #ffffff;

            text-shadow:
                0 0 20px rgba(160, 20, 50, .25),
                0 0 60px rgba(120, 10, 40, .12);
        }

        .title .ghl {
            color: #ffffff;

            text-shadow:
                0 0 20px rgba(100, 40, 120, .25),
                0 0 60px rgba(80, 20, 100, .12);
        }

        .title .x {
            font-size: .45em;

            font-weight: 300;

            letter-spacing: 0;

            color: #c9a1aa;

            text-shadow:
                0 0 15px rgba(255, 100, 130, .45);
        }


        /* =========================================
           PRESENTS
        ========================================= */

        .presented {
            position: relative;

            margin-top: 22px;

            font-size: 11px;

            letter-spacing: 7px;

            text-transform: uppercase;

            color: rgba(255,255,255,.55);
        }

        .presented::before,
        .presented::after {
            content: "";

            position: absolute;

            top: 50%;

            width: 55px;
            height: 1px;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    rgba(255,255,255,.3)
                );
        }

        .presented::before {
            right: calc(100% + 20px);
        }

        .presented::after {
            left: calc(100% + 20px);

            transform: rotate(180deg);
        }


        /* =========================================
           ENTER BUTTON
        ========================================= */

        .enter-button {
            position: relative;

            margin-top: 55px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 190px;

            padding: 15px 30px;

            border: 1px solid rgba(255,255,255,.28);

            border-radius: 2px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.07),
                    rgba(255,255,255,.015)
                );

            color: #fff;

            text-decoration: none;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 3px;

            text-transform: uppercase;

            overflow: hidden;

            transition:
                background .35s ease,
                border-color .35s ease,
                transform .35s ease,
                box-shadow .35s ease;
        }


        /* Button shine */

        .enter-button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.15),
                    transparent
                );

            transition: .55s ease;
        }

        .enter-button:hover::before {
            left: 120%;
        }

        .enter-button:hover {
            background:
                rgba(255,255,255,.1);

            border-color:
                rgba(255,255,255,.7);

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 40px rgba(0,0,0,.5),
                0 0 25px rgba(150,30,60,.15);
        }

        .enter-button span {
            margin-left: 14px;

            font-size: 17px;

            transition:
                transform .3s ease;
        }

        .enter-button:hover span {
            transform:
                translateX(5px);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .title {
                gap: 13px;

                font-size:
                    clamp(
                        42px,
                        14vw,
                        65px
                    );

                letter-spacing: -3px;
            }

            .presented {
                margin-top: 18px;

                font-size: 9px;

                letter-spacing: 5px;
            }

            .presented::before,
            .presented::after {
                width: 30px;
            }

            .presented::before {
                right:
                    calc(100% + 12px);
            }

            .presented::after {
                left:
                    calc(100% + 12px);
            }

            .enter-button {
                margin-top: 42px;

                min-width: 170px;

                padding: 14px 24px;

                font-size: 9px;

                letter-spacing: 2px;
            }

            .decor-line.left {
                left: 5%;
            }

            .decor-line.right {
                right: 5%;
            }

            .sakura {
                opacity: .5;
            }
        }


        /* =========================================
           SMALL PHONE
        ========================================= */

        @media (max-width: 400px) {

            .title {
                gap: 9px;

                font-size: 40px;

                letter-spacing: -2px;
            }

            .presented {
                font-size: 8px;

                letter-spacing: 4px;
            }

            .enter-button {
                margin-top: 35px;
            }
        }

        /* =========================================
   PHONE BROWSER VIEW
========================================= */

@media (max-width: 600px) {

    .intro-page {
        min-height: 100svh;
        height: 100svh;

        padding:
            env(safe-area-inset-top)
            20px
            env(safe-area-inset-bottom)
            20px;
    }

    .intro-content {
        width: 100%;
        max-width: 100%;
        padding: 0 20px;
    }

    .title {
        width: 100%;

        display: flex;
        justify-content: center;
        align-items: center;

        gap: 10px;

        font-size: clamp(38px, 13vw, 58px);

        letter-spacing: -2px;

        white-space: nowrap;
    }

    .title .x {
        font-size: .42em;
    }

    .presented {
        margin-top: 16px;

        font-size: 8px;

        letter-spacing: 4px;

        white-space: nowrap;
    }

    .presented::before,
    .presented::after {
        width: 25px;
    }

    .presented::before {
        right: calc(100% + 10px);
    }

    .presented::after {
        left: calc(100% + 10px);
    }

    .enter-button {
        margin-top: 40px;

        width: 170px;
        min-width: 170px;

        padding: 14px 20px;

        font-size: 9px;

        letter-spacing: 2px;
    }

    .enter-button span {
        font-size: 15px;
        margin-left: 10px;
    }

    .decor-line {
        height: 30vh;
    }

    .decor-line.left {
        left: 4%;
    }

    .decor-line.right {
        right: 4%;
    }

    .sakura {
        transform-origin: center;
    }
}


/* =========================================
   VERY SMALL PHONE
========================================= */

@media (max-width: 380px) {

    .intro-content {
        padding: 0 10px;
    }

    .title {
        gap: 7px;
        font-size: 36px;
    }

    .presented {
        font-size: 7px;
        letter-spacing: 3px;
    }

    .presented::before,
    .presented::after {
        width: 20px;
    }

    .presented::before {
        right: calc(100% + 8px);
    }

    .presented::after {
        left: calc(100% + 8px);
    }

    .enter-button {
        width: 160px;
        min-width: 160px;

        margin-top: 35px;
    }
}
    </style>
</head>

<body>

    <main class="intro-page">

        <!-- Sakura petals -->
        <div class="sakura"></div>
        <div class="sakura"></div>
        <div class="sakura"></div>
        <div class="sakura"></div>
        <div class="sakura"></div>
        <div class="sakura"></div>
        <div class="sakura"></div>
        <div class="sakura"></div>
        <div class="sakura"></div>

        <!-- Decorative lines -->
        <div class="decor-line left"></div>
        <div class="decor-line right"></div>


        <!-- Center -->
        <div class="intro-content">

            <h1 class="title">

                <span class="akasa">
                    AKASA
                </span>

                <span class="x">
                    ×
                </span>

                <span class="ghl">
                    GHL
                </span>

            </h1>


            <div class="presented">
                PRESENTS
            </div>


            <a
                href="home.html"
                class="enter-button"
            >
                ENTER

                <span>
                    →
                </span>
            </a>

        </div>

    </main>

</body>
</html>
